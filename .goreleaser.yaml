version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: gac
    main: ./cmd/gac
    binary: gac
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gac
    formats: [tar.gz]
    name_template: "gac_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: gaborltd
    name: gac
